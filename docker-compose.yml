# Boss Man Dashboard — full self-contained stack.
# start.sh will skip litellm + postgres if ao-briefcase is already running on :4000.

services:
  # ── LiteLLM ─────────────────────────────────────────────────────────────────
  # Skipped by start.sh when ao-briefcase's LiteLLM is already on :4000.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./callbacks.py:/app/callbacks.py:ro
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-placeholder}"
      DATABASE_URL: "postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
      LANGFUSE_HOST: "http://langfuse-web:3000"
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "8"]
    profiles: ["standalone"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["standalone"]

  # ── Dolt (Beads backend) — always started ────────────────────────────────────
  dolt:
    image: dolthub/dolt-sql-server:latest
    restart: unless-stopped
    ports:
      - "${DOLT_PORT:-3306}:3306"
    volumes:
      - dolt_data:/var/lib/dolt
    environment:
      DOLT_ROOT_PASSWORD: "${DOLT_ROOT_PASSWORD}"
    command: >
      --host 0.0.0.0
      --port 3306
      --user root
      --password ${DOLT_ROOT_PASSWORD}

  # ── Langfuse — on :3002 to avoid collision with mr-robot's :3000 ─────────────
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    ports:
      - "${LANGFUSE_PORT:-3002}:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:${LANGFUSE_PORT:-3002}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD}"
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dolt_data:
  langfuse_db_data:
