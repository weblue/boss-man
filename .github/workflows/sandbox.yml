name: Sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'sandcastle/Dockerfile'
      - 'scripts/spawn-worker'
  pull_request:
    paths:
      - 'sandcastle/Dockerfile'
      - 'scripts/spawn-worker'

env:
  # Sync with the ARG default in sandcastle/Dockerfile.
  # Bump this when upgrading bd on the host.
  BEADS_VERSION: '1.0.4'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/boss-man-sandbox

jobs:
  build:
    name: Build sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandcastle/Dockerfile
          build-args: |
            BEADS_VERSION=${{ env.BEADS_VERSION }}
          # Push only when merging to main; PRs just build for verification.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache layers in the registry so rebuilds only re-run changed steps.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
