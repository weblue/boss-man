# Boss Man Dashboard — LiteLLM config
# Auto-generated by start.sh — re-run ./start.sh to change model profile.
# Anthropic/Claude models are NOT listed here; they route natively through
# claude-code in Claude mode (subscription auth, no API key required).

model_list:
  # ── Local model (requires Ollama on host) ───────────────────────────────
  - model_name: local-worker
    litellm_params:
      model: ollama_chat/hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
      api_base: http://host.docker.internal:11434
    model_info:
      supports_function_calling: true
      route_family: local
      intended_complexity: simple

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  forward_client_headers_to_llm_api: true

litellm_settings:
  drop_params: true
  store_prompts_in_spend_logs: true
  success_callback:
    - langfuse
  failure_callback:
    - langfuse
