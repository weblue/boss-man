# Boss Man Dashboard — nginx config template
# __SERVER_PORT__ is substituted by start.sh from SERVER_PORT in .env.
# The rendered file is written to nginx/.current.conf and bind-mounted into
# the boss-man-nginx container at runtime.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    # proxy_buffering off is required for SSE streams (/api/*/events) to reach
    # the browser immediately; safe for regular JSON responses too.
    location /api/ {
        proxy_pass         http://host.docker.internal:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # MCP (Model Context Protocol) — agent tool calls via Streamable HTTP
    location /mcp {
        proxy_pass         http://host.docker.internal:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health {
        proxy_pass         http://host.docker.internal:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
